[package]
name = "bin-rs"
license = "MIT"
description = "Binary Reader from multi source"
readme = "README.md"
authors = ["mith-mmk <47620686+mith-mmk@users.noreply.github.com>"]
repository = "https://github.com/mith-mmk/bin-rs"
edition = "2021"
rust-version = "1.71"
version = "0.1.0"
keywords = ["io", "binary"]

[features]
default = []
stream = []
async = ["tokio"]
serde = ["bytes"]
util = []

[dependencies]
tokio = {version = "1", optional = true, features = ["io-util","macros", "rt"]}
bytes = {version = "1", optional = true, features = ["serde"] }

# Keep this pair aligned with the CLI installed by CI. Native builds do not compile it.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.100"
wasm-bindgen-test = "=0.3.50"
